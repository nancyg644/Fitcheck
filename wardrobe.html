
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Wardrobe | FitCheck</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #eeeae5;
      color: #29241f;
      font-family: 'DM Sans', sans-serif;
    }

    /* Centered mobile app */

    .app {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      margin: 0 auto;
      background: #faf8f5;
      box-shadow: 0 0 40px #00000012;
      display: flex;
      flex-direction: column;
    }

    /* Header */

    header {
      padding: 25px 24px 15px;
      border-bottom: 1px solid #eee7df;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 34px;
      font-weight: 600;
      color: #29241f;
      text-decoration: none;
    }

    .profile-icon {
      width: 38px;
      height: 38px;
      background: #f0ebe5;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    /* Main content */

    main {
      flex: 1;
      padding: 30px 22px 40px;
    }

    .eyebrow {
      color: #b66d4b;
      font-size: 10px;
      letter-spacing: 2px;
      font-weight: 700;
      text-transform: uppercase;
    }

    h1, h2, h3 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 500;
    }

    h1 {
      font-size: 34px;
      line-height: 1.1;
      margin: 12px 0;
      letter-spacing: -0.5px;
    }

    .intro {
      color: #8d8379;
      font-size: 13px;
      line-height: 1.7;
      margin-bottom: 30px;
    }

    /* Wardrobe grid */

    .wardrobe-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px 14px;
    }

    .clothing-card {
      background: transparent;
      border: none;
      padding: 0;
      min-width: 0;
    }

    /* Clothing photo tiles */

    .clothing-image {
      width: 100%;
      aspect-ratio: 1 / 1.2;
      background: #f3e8d6;
      border-radius: 24px;
      overflow: hidden;
    }

    .clothing-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Clothing name beneath each photo */

    .clothing-card h3 {
      font-family: 'DM Sans', sans-serif;
      color: #29241f;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.4;
      margin: 10px 3px 0;
    }

    /* Bottom navigation */

    .bottom-nav {
      position: sticky;
      bottom: 0;
      background: #ffffff;
      border-top: 1px solid #eee7df;
      display: flex;
      justify-content: space-around;
      padding: 12px 8px max(12px, env(safe-area-inset-bottom));
    }

    .bottom-nav a {
      color: #93887c;
      text-decoration: none;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      min-width: 75px;
    }

    .bottom-nav a span {
      font-size: 22px;
    }

    .bottom-nav a.active {
      color: #b66d4b;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <div class="app">

    <!-- Header -->
    <header>
      <a class="logo" href="index.html">FitCheck</a>
      <div class="profile-icon" aria-hidden="true">♡</div>
    </header>

    <main>
      <p class="eyebrow">Your collection</p>

      <h1>Everything in your closet.</h1>

      <p class="intro">
        A little reminder of all the pieces you already love.
        Rediscover your wardrobe, one item at a time.
      </p>

      <div class="wardrobe-grid">

        <!-- White T-Shirt -->
        <div class="clothing-card">
          <div class="clothing-image">
            <img src="images/white-tshirt.jpg" alt="White T-Shirt">
          </div>
          <h3>White T-Shirt</h3>
        </div>

        <!-- Blue Jeans -->
        <div class="clothing-card">
          <div class="clothing-image">
            <img src="images/blue-jeans.jpg" alt="Blue Jeans">
          </div>
          <h3>Blue Jeans</h3>
        </div>

        <!-- Black Dress -->
        <div class="clothing-card">
          <div class="clothing-image">
            <img src="images/black-dress.jpg" alt="Black Dress">
          </div>
          <h3>Black Dress</h3>
        </div>

        <!-- White Sneakers -->
        <div class="clothing-card">
          <div class="clothing-image">
            <img src="images/white-sneakers.jpg" alt="White Sneakers">
          </div>
          <h3>White Sneakers</h3>
        </div>

        <!-- Denim Jacket -->
        <div class="clothing-card">
          <div class="clothing-image">
            <img src="images/denim-jacket.jpg" alt="Denim Jacket">
          </div>
          <h3>Denim Jacket</h3>
        </div>

        <!-- Pink Blouse -->
        <div class="clothing-card">
          <div class="clothing-image">
            <img src="images/pink-blouse.jpg" alt="Pink Blouse">
          </div>
          <h3>Pink Blouse</h3>
        </div>

      </div>
    </main>

    <!-- Bottom navigation -->
    <nav class="bottom-nav" aria-label="Main navigation">

      <a href="index.html">
        <span>⌂</span>
        Home
      </a>

      <a href="wardrobe.html" class="active" aria-current="page">
        <span>▦</span>
        Wardrobe
      </a>

      <a href="outfits.html">
        <span>✧</span>
        Outfits
      </a>

    </nav>

  </div>
</body>
</html>
