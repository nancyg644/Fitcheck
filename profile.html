<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Style Profile | FitCheck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="profile-link.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eeeae5; color: #29241f; font-family: 'DM Sans', sans-serif; }
    .app {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      margin: 0 auto;
      background: #faf8f5;
      box-shadow: 0 0 40px #00000012;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 25px 24px 15px;
      border-bottom: 1px solid #eee7df;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo { font: 600 34px 'Cormorant Garamond', serif; color: inherit; text-decoration: none; }
    .profile-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #f0ebe5;
      display: grid;
      place-items: center;
      font-size: 20px;
    }
    main { flex: 1; padding: 30px 22px 40px; }
    h1, legend { font-family: 'Cormorant Garamond', serif; font-weight: 500; }
    h1 { margin: 0 0 12px; font-size: 34px; line-height: 1.1; letter-spacing: -0.5px; }
    .intro, #profile-status { color: #806f60; font-size: 13px; line-height: 1.6; }
    fieldset {
      min-width: 0;
      margin: 18px 0;
      padding: 8px 12px 12px;
      border: 1px solid #eae3da;
      border-radius: 18px;
      background: #fff;
    }
    legend { font-size: 24px; padding: 0 5px; }
    .preference-options, .profile-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .preference-options label, .profile-actions button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid #eae3da;
      border-radius: 22px;
      background: #faf8f5;
      color: #29241f;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    .preference-options input { accent-color: #806f60; margin: 0; }
    .preference-options label:has(input:checked) { border-color: #806f60; background: #f0ebe5; }
    .preference-options label:has(input:focus-visible), .profile-actions button:focus-visible {
      outline: 3px solid #b66d4b;
      outline-offset: 3px;
    }
    .profile-actions button[type="submit"] { background: #29241f; color: #faf8f5; border-color: #29241f; }
    #profile-status:empty { margin: 0; }
    .bottom-nav {
      position: sticky;
      bottom: 0;
      background: #fff;
      border-top: 1px solid #eee7df;
      display: flex;
      justify-content: space-around;
      padding: 12px 8px max(12px, env(safe-area-inset-bottom));
    }
    .bottom-nav a {
      color: #93887c;
      text-decoration: none;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      min-width: 75px;
    }
    .bottom-nav a span { font-size: 22px; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <a class="logo" href="index.html">FitCheck</a>
      <a class="profile-icon" href="profile.html" aria-label="Style profile" aria-current="page">♡</a>
    </header>
    <main>
      <h1>Your style profile</h1>
      <p class="intro">Choose the styles, colors, and dressing priority you’d like to see in your outfit ideas.</p>
      <form id="style-profile" hidden>
        <fieldset>
          <legend>Styles</legend>
          <div class="preference-options" data-preference="styles"></div>
        </fieldset>
        <fieldset>
          <legend>Colors</legend>
          <div class="preference-options" data-preference="colors"></div>
        </fieldset>
        <fieldset>
          <legend>Dressing priority</legend>
          <div class="preference-options" data-preference="priority"></div>
        </fieldset>
        <div class="profile-actions">
          <button type="submit">Save My Preferences</button>
          <button id="reset-style-preferences" type="button">Reset Preferences</button>
        </div>
        <p id="profile-status" role="status"></p>
      </form>
    </main>
    <nav class="bottom-nav" aria-label="Main navigation">
      <a href="index.html"><span aria-hidden="true">⌂</span>Home</a>
      <a href="wardrobe.html"><span aria-hidden="true">▦</span>Wardrobe</a>
      <a href="outfits.html"><span aria-hidden="true">✧</span>Outfits</a>
    </nav>
  </div>
  <script src="style-preferences-store.js"></script>
  <script src="style-profile.js"></script>
</body>
</html>
