
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>FitCheck | Home</title>

  <link rel="preconnect"
        href="https://fonts.googleapis.com">
  <link rel="preconnect"
        href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

   body {
  margin: 0;
  background: #eeeae5;
  color: #29241f;
  font-family: 'DM Sans', sans-serif;
}

    .app {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      margin: 0 auto;
      background: #faf8f5;
      box-shadow: 0 0 40px #00000012;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 25px 24px 15px;
      border-bottom: 1px solid #eee7df;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 34px;
      font-weight: 600;
      color: #29241f;
      text-decoration: none;
    }

    .profile-icon {
      width: 38px;
      height: 38px;
      background: #f0ebe5;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    main {
      flex: 1;
      padding: 30px 22px 40px;
    }

    .eyebrow {
      color: #b66d4b;
      font-size: 10px;
      letter-spacing: 2px;
      font-weight: 700;
    }

    h1, h2, h3 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 500;
    }

   h1 {
  font-size: 30px;
  line-height: 1.15;
  margin: 12px 0;
  letter-spacing: -0.5px;
  white-space: nowrap;
}

   .intro {
  color: #82786e;
  font-size: 13px;
  line-height: 1.7;
  margin-bottom: 30px;
}

   
.occasion-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}

.occasion-card {
  background: #ffffff;
  border: 1px solid #eae3da;
  border-radius: 18px;
  padding: 14px 16px;
  min-height: 76px;
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 16px;
}

.occasion-icon {
  width: 48px;
  height: 48px;
  min-width: 48px;
  background: #f5f1eb;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #806f60;
}

.occasion-icon svg {
  width: 23px;
  height: 23px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.occasion-card h3 {
  font-size: 24px;
  margin: 0;
  white-space: nowrap;
}

    .wardrobe-banner {
      display: block;
      background: #29241f;
      color: white;
      padding: 24px;
      border-radius: 22px;
      margin-top: 28px;
      text-decoration: none;
    }

    .wardrobe-banner .eyebrow {
      color: #d9b58e;
    }

    .wardrobe-banner h2 {
      font-size: 30px;
      line-height: 1.1;
      margin: 12px 0;
    }

    .wardrobe-banner p {
      font-size: 12px;
      color: #dcd3c9;
      margin: 0;
    }

    .bottom-nav {
      position: sticky;
      bottom: 0;
      background: white;
      border-top: 1px solid #eee7df;
      display: flex;
      justify-content: space-around;
      padding: 12px 8px max(12px, env(safe-area-inset-bottom));
    }

    .bottom-nav a {
      color: #93887c;
      text-decoration: none;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      min-width: 75px;
    }

    .bottom-nav a span {
      font-size: 22px;
    }

    .bottom-nav a.active {
      color: #b66d4b;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <div class="app">

    <header>
      <a class="logo" href="index.html">FitCheck</a>
      <div class="profile-icon" aria-hidden="true">♡</div>
    </header>

    <main> 
<p class="eyebrow">YOUR PERSONAL STYLE COMPANION</p>

<h1>What are we dressing for?</h1>

<p class="intro">
  Pick an occasion and we'll curate outfits
  from your wardrobe.
</p>

<div class="occasion-grid">

  <div class="occasion-card">
    <span class="occasion-icon">
      <svg viewBox="0 0 24 24">
        <rect x="3" y="7" width="18" height="14" rx="2"/>
        <path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        <path d="M3 12h18"/>
      </svg>
    </span>
    <h3>Work</h3>
  </div>

  <div class="occasion-card">
    <span class="occasion-icon">
      <svg viewBox="0 0 24 24">
        <path d="M4 3v7a3 3 0 0 0 6 0V3"/>
        <path d="M7 3v18"/>
        <path d="M17 21V3c-4 3-4 9 0 11h3"/>
      </svg>
    </span>
    <h3>Dinner Out</h3>
  </div>

  <div class="occasion-card">
    <span class="occasion-icon">
      <svg viewBox="0 0 24 24">
        <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/>
      </svg>
    </span>
    <h3>Date Night</h3>
  </div>

  <div class="occasion-card">
    <span class="occasion-icon">
      <svg viewBox="0 0 24 24">
        <path d="M4 8h13v7a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V8z"/>
        <path d="M17 9h2a3 3 0 0 1 0 6h-2"/>
        <path d="M8 3v2M13 3v2"/>
      </svg>
    </span>
    <h3>Casual Weekend</h3>
  </div>

  <div class="occasion-card">
    <span class="occasion-icon">
      <svg viewBox="0 0 24 24">
        <path d="m12 2 2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2L12 2z"/>
      </svg>
    </span>
    <h3>Party</h3>
  </div>

</div>


      <a class="wardrobe-banner" href="wardrobe.html">
        <span class="eyebrow">✦ YOUR WARDROBE</span>
        <h2>6 pieces →</h2>
        <p>Rediscover what you already own →</p>
      </a>
    </main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <a href="index.html" class="active" aria-current="page">
        <span>⌂</span>
        Home
      </a>
      <a href="wardrobe.html">
        <span>▦</span>
        Wardrobe
      </a>
      <a href="outfits.html">
        <span>✧</span>
        Outfits
      </a>
    </nav>

  </div>
</body>
</html>
